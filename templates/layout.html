<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>{% block page_title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">AI BI</div>
        <nav>
          {% if current_user and current_user.role == 'admin' %}
            <a href="{{ url_for('admin_dashboard') }}">Admin Dashboard</a>
            <a href="{{ url_for('business_pulse_page') }}">AI Business Pulse</a>
            <a href="{{ url_for('user_dashboard') }}#forecast-panel">Revenue Forecast</a>
            <a href="{{ url_for('user_dashboard') }}#customer-health">Customer Health</a>
          {% else %}
            <a href="{{ url_for('account_page') }}">Account</a>
          {% endif %}
          <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
      </aside>
      <main class="main-panel">
        {% block content %}{% endblock %}
      </main>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
